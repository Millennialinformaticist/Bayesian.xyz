name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Import smoke
        run: python -c "from bayesian_engine import BayesianConvictionEngine; print(BayesianConvictionEngine)"
      - name: Engine CLI
        run: python bayesian_engine.py
      - name: Pytest
        run: pytest -q
